<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

  <meta name="theme-color" content="#246b35">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <title>Survival Island</title>
</head>

<body>

  <!-- GAME -->
  <canvas id="game"></canvas>

  <!-- PIXEL HUD -->
  <div id="hud" class="pixel-frame hud-frame">

    <div class="game-title">
      SURVIVAL ISLAND
    </div>

    <div id="stats" class="stats">
      DAY 1  06:00
    </div>

  </div>

  <!-- MESSAGE / RPG DIALOGUE -->
  <div id="message" class="pixel-frame message-box"></div>

  <!-- PIXEL JOYSTICK -->
  <div id="joystick" class="pixel-frame joystick-frame">
    <div id="stick"></div>
  </div>

  <!-- ACTION BUTTONS -->
  <div id="buttons">

    <button id="use" class="pixel-button">
      USE
    </button>

    <button id="craft" class="pixel-button">
      CRAFT
    </button>

    <button id="save" class="pixel-button">
      SAVE
    </button>

    <button id="eat" class="pixel-button">
      EAT
    </button>

  </div>

  <script src="game.js"></script>

</body>
</html>
